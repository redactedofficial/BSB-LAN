        entity_id: input_boolean.bsb_calendar_enabled
    - action: script.bsb_heat_control
      data:
        operation: start
        source: manual
        target: '{{ states(''input_number.bsb_return_stop_temperature'') }}'
  bsb_manual_heat_stop:
    alias: Stop cycle and pause calendar
    mode: single
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.bsb_calendar_enabled
    - action: script.bsb_heat_control
      data:
        operation: stop
        reason: Manual stop
automation:
- id: bsb_manual_return_cutoff
  alias: BSB water-cycle cutoff and recovery
  mode: single
  triggers:
  - trigger: time_pattern
    seconds: /15
    id: tick
  - trigger: homeassistant
    event: start
    id: restart
  - trigger: state
    entity_id:
    - sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value
    - select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
    - select.bsb_lan_00_29_configuration_5978_type_of_contact_h5
    - text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc
    - sensor.bsb_lan_00_33_io_test_7865_contact_state_h5
    - sensor.bsb_lan_00_31_error_6700_error_signal
    - input_boolean.bsb_thermostat_override
    id: feedback
  conditions:
  - condition: state
    entity_id: input_boolean.bsb_manual_heat_active
    state: 'on'
  - condition: state
    entity_id: script.bsb_heat_control
    state: 'off'
  actions:
  - action: mqtt.publish
    data:
      topic: BSB-LAN/0/36/8314/poll
      payload: ''
      retain: false
  - action: mqtt.publish
    data:
      topic: BSB-LAN/0/33/7865/poll
      payload: ''
      retain: false
  - action: mqtt.publish
    data:
      topic: BSB-LAN/0/31/6700/poll
      payload: ''
      retain: false
  - variables:
      current_mode: '{{ states(''select.bsb_lan_00_09_heating_circuit_1_700_operating_mode'') }}'
      cutoff: '{{ states(''input_number.bsb_cycle_return_target'') | float(0) }}'
      stale: '{{ not is_number(states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'')) or state_attr(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'',
        ''unit_of_measurement'') != ''°C'' or as_timestamp(now()) - (state_attr(''sensor.bsb_heat_return_readback'', ''received_at'')
        | float(0)) > 180 or as_timestamp(now()) - (state_attr(''sensor.bsb_heat_error_readback'', ''received_at'') | float(0))
        > 180 or as_timestamp(now()) - (state_attr(''sensor.bsb_heat_contact_readback'', ''received_at'') | float(0)) > 180
        }}'
      boiler_fault: '{{ states(''sensor.bsb_lan_00_31_error_6700_error_signal'').split('' - '')[0] != ''0'' }}'
      deadline_passed: '{{ as_timestamp(now()) >= as_timestamp(states(''input_datetime.bsb_manual_heat_deadline''), 0) }}'
      external_change: '{{ states(''select.bsb_lan_00_09_heating_circuit_1_700_operating_mode'') not in [''3 - Comfort'',
        ''unknown'', ''unavailable''] or (states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') not in [''unknown'',
        ''unavailable''] and states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') != states(''input_text.bsb_cycle_h5''))
        or states(''select.bsb_lan_00_29_configuration_5977_input_h5_function_selection'') != ''18 - Room thermostat HC1''
        or states(''input_boolean.bsb_thermostat_override'') != states(''input_boolean.bsb_cycle_override'') or (is_number(states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc''))
        and (states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc'') | float - states(''input_number.bsb_cycle_flow_target'')
        | float) | abs >= 0.11) }}'
  - choose:
    - conditions: '{{ trigger.id == ''restart'' or states(''input_text.bsb_manual_heat_status'').startswith((''Stopping:'',
        ''Stop not'', ''Start protection'', ''Thermostat restore'', ''Flow setting restore'', ''Restoration feedback'')) }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bsb_calendar_enabled
      - action: script.bsb_heat_control
        data:
          operation: stop
          reason: Recovery after restart or failed acknowledgement
    default:
    - choose:
      - conditions: '{{ external_change }}'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.bsb_calendar_enabled
        - action: script.bsb_heat_control
          data:
            operation: stop
            reason: Settings changed outside cycle
            preserve_mode: '{{ current_mode not in [''3 - Comfort'', ''unknown'', ''unavailable''] }}'
      default:
      - choose:
        - conditions: '{{ stale or deadline_passed or cutoff < 30 or cutoff > 55 or boiler_fault }}'
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bsb_calendar_enabled
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.bsb_heat_fault
          - action: script.bsb_heat_control
            data:
              operation: stop
              reason: '{{ ''Feedback lost'' if stale else (''Boiler error'' if boiler_fault else (''Maximum run time reached''
                if deadline_passed else ''Invalid cutoff'')) }}'
        default:
        - choose:
          - conditions: '{{ states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'') | float(0)
              >= cutoff }}'
            sequence:
            - action: script.bsb_heat_control
              data:
                operation: stop
                reason: Return-water target reached
  - choose:
    - conditions: '{{ is_state(''input_boolean.bsb_manual_heat_active'', ''on'') and is_state(''input_boolean.bsb_thermostat_override'',
        ''on'') and is_state(''input_boolean.bsb_heat_fault'', ''off'') and states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'')
        in [''0'', ''1''] and states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') == states(''input_text.bsb_cycle_h5'')
        and states(''input_text.bsb_cycle_h5'') != (''0 - normal closed'' if states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'')
        == ''0'' else ''1 - normal opened'') }}'
      sequence:
      - action: script.bsb_heat_control
        data:
          operation: refresh_request
- id: bsb_calendar_water_heating
  alias: BSB heating calendar 50/40 return targets
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: calendar
    entity_id: calendar.heating
    event: start
  - trigger: calendar
    entity_id: calendar.heating
    event: end
  - trigger: state
    entity_id:
    - input_boolean.bsb_calendar_enabled
    - input_number.bsb_calendar_hot_target
    - input_number.bsb_calendar_cool_target
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      calendar_result: {}
  - action: calendar.get_events
    response_variable: calendar_result
    continue_on_error: true
    target:
      entity_id: calendar.heating
    data:
      start_date_time: '{{ (now() - timedelta(days=1)).isoformat() }}'
      end_date_time: '{{ (now() + timedelta(days=1)).isoformat() }}'
  - choose:
    - conditions: '{{ ''calendar.heating'' not in calendar_result or states(''calendar.heating'') not in [''on'', ''off'']
        }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.bsb_calendar_status
        data:
          value: Calendar unavailable; heating schedule paused
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bsb_calendar_enabled
      - choose:
        - conditions: '{{ is_state(''input_boolean.bsb_manual_heat_active'', ''on'') and states(''input_text.bsb_heat_owner'')
            == ''calendar'' }}'
          sequence:
          - action: script.bsb_heat_control
            data:
              operation: stop
              reason: Calendar unavailable
      - stop: Calendar feedback required
  - variables:
      window_active: '{%- set ns = namespace(active=false) -%}{%- for event in calendar_result[''calendar.heating''][''events'']
        -%}{%- if as_timestamp(event.start, 0) <= as_timestamp(now()) < as_timestamp(event.end, 0) -%}{%- set ns.active =
        true -%}{%- endif -%}{%- endfor -%}{{ ns.active }}'
  - choose:
    - conditions: '{{ window_active }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bsb_calendar_window_active
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.bsb_calendar_window_active
  - variables:
      calendar_target: '{{ states(''input_number.bsb_calendar_hot_target'' if window_active else ''input_number.bsb_calendar_cool_target'')
        | float(0) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.bsb_calendar_status
    data:
      value: '{{ (''Enabled: '' if is_state(''input_boolean.bsb_calendar_enabled'', ''on'') else ''Paused: '') ~ (''event''
        if window_active else ''between events'') ~ '' target '' ~ calendar_target ~ '' °C return'' }}'
  - choose:
    - conditions: '{{ not is_state(''input_boolean.bsb_calendar_enabled'', ''on'') }}'
      sequence:
      - choose:
        - conditions: '{{ is_state(''input_boolean.bsb_manual_heat_active'', ''on'') and states(''input_text.bsb_heat_owner'')
            == ''calendar'' }}'
          sequence:
          - action: script.bsb_heat_control
            data:
              operation: stop
              reason: Calendar paused
      - stop: Calendar is paused
  - choose:
    - conditions: '{{ is_state(''input_boolean.bsb_heat_fault'', ''on'') }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bsb_calendar_enabled
      - action: input_text.set_value
        target:
          entity_id: input_text.bsb_calendar_status
        data:
          value: 'Paused: cycle fault; check boiler and clear the cycle fault'
      - stop: Fault must be checked before enabling the calendar
  - choose:
    - conditions: '{{ is_state(''input_boolean.bsb_manual_heat_active'', ''on'') }}'
      sequence:
      - choose:
        - conditions: '{{ states(''input_text.bsb_heat_owner'') == ''calendar'' and (states(''input_number.bsb_cycle_return_target'')
            | float(0) - calendar_target) | abs > 0.1 }}'
          sequence:
          - action: script.bsb_heat_control
            data:
              operation: stop
              reason: Calendar target changed
      - stop: An existing cycle owns circuit 1
  - condition: state
    entity_id: script.bsb_heat_control
    state: 'off'
  - condition: state
    entity_id: input_boolean.bsb_heat_fault
    state: 'off'
  - condition: template
    value_template: '{{ is_number(states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'')) and
      states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'') | float < calendar_target - states(''input_number.bsb_calendar_hysteresis'')
      | float(2) and as_timestamp(now()) >= as_timestamp(states(''input_datetime.bsb_heat_next_start''), 0) }}'
  - action: script.bsb_heat_control
    data:
      operation: start
      source: calendar
      target: '{{ calendar_target }}'
template:
- sensor:
  - name: Heating calendar return target
    unique_id: bsb_calendar_return_target
    unit_of_measurement: °C
    device_class: temperature
    state: '{{ states(''input_number.bsb_calendar_hot_target'' if is_state(''input_boolean.bsb_calendar_window_active'', ''on'')
      else ''input_number.bsb_calendar_cool_target'') }}'
    availability: '{{ states(''calendar.heating'') in [''on'', ''off''] }}'
  - name: BSB heating state
    unique_id: bsb_heating_state
    state: '{% set value = states(''sensor.bsb_lan_00_34_status_8000_status_heating_circuit_1'') %}{{ {''122'': ''Room limited'',
      ''114'': ''Comfort'', ''121'': ''Frost protect'', ''17'': ''Overrun''}.get(value.split('' - '')[0], value.split('' -
      '', 1)[-1]) }}'
    availability: '{{ states(''sensor.bsb_lan_00_34_status_8000_status_heating_circuit_1'') not in [''unknown'', ''unavailable'']
      }}'
  - name: BSB dhw state
    unique_id: bsb_dhw_state
    state: '{% set value = states(''sensor.bsb_lan_00_34_status_8003_status_dhw'') %}{{ {''99'': ''Charged''}.get(value.split(''
      - '')[0], value.split('' - '', 1)[-1]) }}'
    availability: '{{ states(''sensor.bsb_lan_00_34_status_8003_status_dhw'') not in [''unknown'', ''unavailable''] }}'
  - name: BSB boiler state
    unique_id: bsb_boiler_state
    state: '{% set value = states(''sensor.bsb_lan_00_34_status_8005_status_boiler'') %}{{ {''25'': ''Off'', ''17'': ''Overrun'',
      ''166'': ''Heating'', ''167'': ''Heating'', ''169'': ''Hot water''}.get(value.split('' - '')[0], value.split('' - '',
      1)[-1]) }}'
    availability: '{{ states(''sensor.bsb_lan_00_34_status_8005_status_boiler'') not in [''unknown'', ''unavailable''] }}'
  - name: BSB h5 contact
    unique_id: bsb_h5_contact
    state: '{% set value = states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'') %}{{ {''0'': ''Open'', ''1'': ''Closed''}.get(value.split(''
      - '')[0], value.split('' - '', 1)[-1]) }}'
    availability: '{{ states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'') not in [''unknown'', ''unavailable'']
      }}'
- triggers:
  - trigger: mqtt
    topic: BSB-LAN/0/9/700/status
  sensor:
  - name: BSB heat mode readback
