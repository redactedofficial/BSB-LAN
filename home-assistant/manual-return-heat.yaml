# Circuit 1 only. Requires original BSB-LAN discovery and calendar.heating.
# Stop/cutoff restores owned H5 contact type and flow settings; circuit 1 ends in Protection.
# A server outage removes this automatic cutoff; native boiler limits remain.
# Calendar is deliberately paused at each HA restart. Helper values restore.
input_number:
  bsb_return_stop_temperature:
    name: Manual return-water stop temperature
    min: 30
    max: 55
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_manual_heat_max_minutes:
    name: Maximum heating-cycle duration
    min: 5
    max: 120
    step: 5
    mode: box
    unit_of_measurement: min
  bsb_calendar_hot_target:
    name: Calendar event return target
    min: 30
    max: 50
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_calendar_cool_target:
    name: Between-events return target
    min: 30
    max: 50
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_calendar_hysteresis:
    name: Return-water restart differential
    min: 1
    max: 5
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_cycle_return_target:
    name: Active cycle return target
    min: 30
    max: 55
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_cycle_flow_target:
    name: Active cycle flow setting
    min: 25
    max: 65
    step: 1
    mode: box
    unit_of_measurement: °C
  bsb_heat_flow_ceiling:
    name: Maximum requested HC1 flow setting
    min: 35
    max: 60
    step: 1
    mode: box
    unit_of_measurement: °C
input_boolean:
  bsb_manual_heat_active:
    name: Heating water cycle active
  bsb_calendar_enabled:
    name: Calendar heating enabled
    initial: false
  bsb_thermostat_override:
    name: Ignore room thermostat during water cycle
  bsb_cycle_override:
    name: Owned cycle thermostat override
  bsb_calendar_window_active:
    name: Heating calendar event active
  bsb_heat_fault:
    name: Heating-cycle fault
input_datetime:
  bsb_manual_heat_deadline:
    name: Heating cycle deadline
    has_date: true
    has_time: true
  bsb_heat_next_start:
    name: Earliest calendar heating restart
    has_date: true
    has_time: true
input_text:
  bsb_manual_heat_status:
    name: Heating cycle status
    max: 120
  bsb_calendar_status:
    name: Heating calendar status
    max: 120
  bsb_heat_owner:
    name: Heating cycle owner
    max: 20
  bsb_saved_mode:
    name: Saved HC1 mode
    max: 80
  bsb_saved_h5:
    name: Saved H5 contact configuration
    max: 80
  bsb_cycle_h5:
    name: Owned H5 contact configuration
    max: 80
  bsb_saved_flow:
    name: Saved HC1 flow setting
    max: 20
script:
  bsb_heat_write_checked:
    alias: BSB checked circuit-1 setting
    mode: queued
    max: 10
    fields:
      entity:
        description: entity
      value:
        description: value
      kind:
        description: kind
    sequence:
    - variables:
        valid_write: '{{ (entity == ''select.bsb_lan_00_09_heating_circuit_1_700_operating_mode'' and value in [''0 - Protection'',
          ''1 - Automatic'', ''2 - Reduced'', ''3 - Comfort''] and kind == ''select'') or (entity == ''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5''
          and value in [''0 - normal closed'', ''1 - normal opened''] and kind == ''select'') or (entity == ''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc''
          and is_number(value) and 25 <= value | float <= 80 and kind == ''text'') }}'
    - choose:
      - conditions: '{{ not valid_write }}'
        sequence:
        - variables:
            write_result:
              ok: false
        - stop: Setting outside the circuit-1 allowlist
          response_variable: write_result
    - variables:
        readback: '{{ ''sensor.bsb_heat_mode_readback'' if entity.startswith(''select.'') and ''700_'' in entity else (''sensor.bsb_heat_h5_readback''
          if entity.startswith(''select.'') else ''sensor.bsb_heat_flow_readback'') }}'
    - variables:
        sent_at: '{{ as_timestamp(now()) }}'
    - choose:
      - conditions: '{{ kind == ''select'' }}'
        sequence:
        - action: select.select_option
          continue_on_error: true
          target:
            entity_id: '{{ entity }}'
          data:
            option: '{{ value }}'
      default:
      - action: text.set_value
        continue_on_error: true
        target:
          entity_id: '{{ entity }}'
        data:
          value: '{{ value }}'
    - wait_template: '{{ (state_attr(readback, ''received_at'') | float(0)) >= sent_at and ((kind == ''select'' and states(entity)
        == value and state_attr(readback, ''payload'') == value) or (kind == ''text'' and is_number(states(entity)) and is_number(state_attr(readback,
        ''payload'')) and (states(entity) | float - value | float) | abs < 0.11 and (state_attr(readback, ''payload'') | float
        - value | float) | abs < 0.11)) }}'
      timeout: 00:00:20
      continue_on_timeout: true
    - variables:
        write_result:
          ok: '{{ wait.completed }}'
    - stop: Readback checked
      response_variable: write_result
  bsb_heat_control:
    alias: BSB serial water-cycle controller
    mode: queued
    max: 5
    fields:
      operation:
        description: operation
      target:
        description: target
      source:
        description: source
      reason:
        description: reason
      preserve_mode:
        description: preserve_mode
    sequence:
    - choose:
      - conditions: '{{ operation == ''start'' }}'
        sequence:
        - variables:
            start_read_at: '{{ as_timestamp(now()) }}'
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/36/8314/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/29/5978/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/9/742/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/9/700/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/29/5977/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/33/7865/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/31/6700/poll
            payload: ''
            retain: false
        - action: mqtt.publish
          data:
            topic: BSB-LAN/0/37/8749/poll
            payload: ''
            retain: false
        - wait_template: '{{ (state_attr(''sensor.bsb_heat_return_readback'', ''received_at'') | float(0)) >= start_read_at
            and (state_attr(''sensor.bsb_heat_h5_readback'', ''received_at'') | float(0)) >= start_read_at and (state_attr(''sensor.bsb_heat_flow_readback'',
            ''received_at'') | float(0)) >= start_read_at and (state_attr(''sensor.bsb_heat_mode_readback'', ''received_at'')
            | float(0)) >= start_read_at and (state_attr(''sensor.bsb_heat_role_readback'', ''received_at'') | float(0)) >=
            start_read_at and (state_attr(''sensor.bsb_heat_contact_readback'', ''received_at'') | float(0)) >= start_read_at
            and (state_attr(''sensor.bsb_heat_error_readback'', ''received_at'') | float(0)) >= start_read_at }}'
          timeout: 00:00:20
          continue_on_timeout: true
        - choose:
          - conditions: '{{ not wait.completed }}'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Blocked: fresh boiler readback not received'
            - stop: 'Blocked: fresh boiler readback not received'
        - variables:
            return_entity: sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value
            mode_entity: select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
            h5_entity: select.bsb_lan_00_29_configuration_5978_type_of_contact_h5
            flow_entity: text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc
            cutoff: '{{ target | float(0) }}'
            requested_flow: '{{ target | float(0) + 5 }}'
            use_override: '{{ is_state(''input_boolean.bsb_thermostat_override'', ''on'') }}'
            feedback_valid: '{{ is_number(states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value''))
              and state_attr(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'', ''unit_of_measurement'')
              == ''°C'' and as_timestamp(now()) - (state_attr(''sensor.bsb_heat_return_readback'', ''received_at'') | float(0))
              <= 180 and states(''select.bsb_lan_00_09_heating_circuit_1_700_operating_mode'') in [''0 - Protection'', ''1
              - Automatic'', ''2 - Reduced'', ''3 - Comfort''] and states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'')
              in [''0 - normal closed'', ''1 - normal opened''] and states(''select.bsb_lan_00_29_configuration_5977_input_h5_function_selection'')
              == ''18 - Room thermostat HC1'' and states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'') in [''0'',
              ''1''] and states(''sensor.bsb_lan_00_31_error_6700_error_signal'').split('' - '')[0] == ''0'' and is_number(states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc''))
              and 25 <= states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc'') |
              float <= 80 and as_timestamp(now()) - (state_attr(''sensor.bsb_heat_h5_readback'', ''received_at'') | float(0))
              <= 180 and as_timestamp(now()) - (state_attr(''sensor.bsb_heat_flow_readback'', ''received_at'') | float(0))
              <= 180 }}'
            forced_contact: '{{ ''0 - normal closed'' if states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'') ==
              ''0'' else ''1 - normal opened'' }}'
        - choose:
          - conditions: '{{ is_state(''input_boolean.bsb_manual_heat_active'', ''on'') }}'
            sequence:
            - stop: A water cycle already owns circuit 1
        - choose:
          - conditions: '{{ not feedback_valid }}'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Blocked: circuit-1 feedback missing or stale'
            - stop: 'Blocked: circuit-1 feedback missing or stale'
        - choose:
          - conditions: '{{ cutoff < 30 or cutoff > 55 or requested_flow > states(''input_number.bsb_heat_flow_ceiling'')
              | float(0) or states(''sensor.bsb_lan_00_36_diagnostics_producer_8314_return_temp_actual_value'') | float >=
              cutoff }}'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Blocked: target reached or exceeds configured flow ceiling'
            - stop: 'Blocked: target reached or exceeds configured flow ceiling'
        - choose:
          - conditions: '{{ not use_override and not ((states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'') == ''1''
              and states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') == ''1 - normal opened'') or (states(''sensor.bsb_lan_00_33_io_test_7865_contact_state_h5'')
              == ''0'' and states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') == ''0 - normal closed''))
              }}'
            sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Blocked: thermostat is not requesting heat; override is off'
            - stop: 'Blocked: thermostat is not requesting heat; override is off'
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_saved_mode
          data:
            value: '{{ states(mode_entity) }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_saved_h5
          data:
            value: '{{ states(h5_entity) }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_cycle_h5
          data:
            value: '{{ forced_contact if use_override else states(h5_entity) }}'
        - choose:
          - conditions: '{{ use_override }}'
            sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.bsb_cycle_override
          default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.bsb_cycle_override
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_saved_flow
          data:
            value: '{{ states(flow_entity) }}'
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_heat_owner
          data:
            value: '{{ source }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.bsb_cycle_return_target
          data:
            value: '{{ cutoff }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.bsb_cycle_flow_target
          data:
            value: '{{ requested_flow }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.bsb_manual_heat_deadline
          data:
            timestamp: '{{ as_timestamp(now()) + states(''input_number.bsb_manual_heat_max_minutes'') | float(60) * 60 }}'
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.bsb_manual_heat_active
        - action: input_text.set_value
          target:
            entity_id: input_text.bsb_manual_heat_status
          data:
            value: Starting water cycle
        - action: homeassistant.save_persistent_states
        - action: script.bsb_heat_write_checked
          response_variable: start_protection
          data:
            entity: select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
            value: 0 - Protection
            kind: select
        - choose:
          - conditions: '{{ not start_protection.ok }}'
            sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.bsb_heat_fault
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: Start protection not confirmed; recovery pending
            - stop: Retain recovery journal
        - action: script.bsb_heat_write_checked
          response_variable: start_flow
          data:
            entity: text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc
            value: '{{ requested_flow | string }}'
            kind: text
        - choose:
          - conditions: '{{ use_override }}'
            sequence:
            - action: script.bsb_heat_write_checked
              response_variable: start_h5
              data:
                entity: select.bsb_lan_00_29_configuration_5978_type_of_contact_h5
                value: '{{ forced_contact }}'
                kind: select
          default:
          - variables:
              start_h5:
                ok: true
        - choose:
          - conditions: '{{ not start_flow.ok or not start_h5.ok }}'
            sequence:
            - condition: state
              entity_id: input_boolean.bsb_manual_heat_active
              state: 'on'
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Stopping: {{ reason | default(''Manual stop'', true) }}'
            - choose:
              - conditions: '{{ not preserve_mode | default(false) }}'
                sequence:
                - action: script.bsb_heat_write_checked
                  response_variable: mode_ack
                  data:
                    entity: select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
                    value: 0 - Protection
                    kind: select
                - choose:
                  - conditions: '{{ not mode_ack.ok }}'
                    sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.bsb_heat_fault
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.bsb_calendar_enabled
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.bsb_manual_heat_status
                      data:
                        value: Stop not confirmed; retry pending
                    - action: persistent_notification.create
                      data:
                        notification_id: bsb_heat_fault
                        title: Heating stop not confirmed
                        message: Check the boiler and MQTT. Circuit-1 stop will be retried; the server cannot stop an unreachable
                          boiler.
                    - stop: Protection was not acknowledged; retain recovery journal
            - variables:
                restore_read_at: '{{ as_timestamp(now()) }}'
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/29/5978/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/9/742/poll
                payload: ''
                retain: false
            - wait_template: '{{ (state_attr(''sensor.bsb_heat_h5_readback'', ''received_at'') | float(0)) >= restore_read_at
                and (state_attr(''sensor.bsb_heat_flow_readback'', ''received_at'') | float(0)) >= restore_read_at }}'
              timeout: 00:00:20
              continue_on_timeout: true
            - choose:
              - conditions: '{{ not wait.completed }}'
                sequence:
                - action: input_text.set_value
                  target:
                    entity_id: input_text.bsb_manual_heat_status
                  data:
                    value: Restoration feedback missing; retry pending
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.bsb_calendar_enabled
                - stop: Keep recovery journal for retry
            - choose:
              - conditions: '{{ states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') == states(''input_text.bsb_cycle_h5'')
                  and states(''input_text.bsb_saved_h5'') in [''0 - normal closed'', ''1 - normal opened''] }}'
                sequence:
                - action: script.bsb_heat_write_checked
                  response_variable: h5_ack
                  data:
                    entity: select.bsb_lan_00_29_configuration_5978_type_of_contact_h5
                    value: '{{ states(''input_text.bsb_saved_h5'') }}'
                    kind: select
                - choose:
                  - conditions: '{{ not h5_ack.ok }}'
                    sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.bsb_manual_heat_status
                      data:
                        value: Thermostat restore not confirmed; retry pending
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.bsb_calendar_enabled
                    - stop: Keep recovery journal for retry
            - choose:
              - conditions: '{{ is_number(states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc''))
                  and is_number(states(''input_text.bsb_saved_flow'')) and (states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc'')
                  | float - states(''input_number.bsb_cycle_flow_target'') | float) | abs < 0.11 }}'
                sequence:
                - action: script.bsb_heat_write_checked
                  response_variable: flow_ack
                  data:
                    entity: text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc
                    value: '{{ states(''input_text.bsb_saved_flow'') }}'
                    kind: text
                - choose:
                  - conditions: '{{ not flow_ack.ok }}'
                    sequence:
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.bsb_manual_heat_status
                      data:
                        value: Flow setting restore not confirmed; retry pending
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.bsb_calendar_enabled
                    - stop: Keep recovery journal for retry
            - choose:
              - conditions: '{{ states(''select.bsb_lan_00_29_configuration_5978_type_of_contact_h5'') in [''unknown'', ''unavailable'']
                  or not is_number(states(''text.bsb_lan_00_09_heating_circuit_1_742_flow_temp_setpoint_room_thermostat_hc1_degc''))
                  }}'
                sequence:
                - action: input_text.set_value
                  target:
                    entity_id: input_text.bsb_manual_heat_status
                  data:
                    value: Restoration feedback missing; retry pending
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.bsb_calendar_enabled
                - stop: Keep recovery journal for retry
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.bsb_manual_heat_active
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.bsb_heat_next_start
              data:
                timestamp: '{{ as_timestamp(now()) + 600 }}'
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Stopped: {{ reason | default(''Manual stop'', true) }}'
            - action: homeassistant.save_persistent_states
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/34/8000/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/34/8005/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/36/8310/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/36/8311/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/37/8749/poll
                payload: ''
                retain: false
            - stop: Start setting not confirmed; restored owned settings
        - action: script.bsb_heat_write_checked
          response_variable: start_mode
          data:
            entity: select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
            value: 3 - Comfort
            kind: select
        - choose:
          - conditions: '{{ not start_mode.ok }}'
            sequence:
            - condition: state
              entity_id: input_boolean.bsb_manual_heat_active
              state: 'on'
            - action: input_text.set_value
              target:
                entity_id: input_text.bsb_manual_heat_status
              data:
                value: 'Stopping: {{ reason | default(''Manual stop'', true) }}'
            - choose:
              - conditions: '{{ not preserve_mode | default(false) }}'
                sequence:
                - action: script.bsb_heat_write_checked
                  response_variable: mode_ack
                  data:
                    entity: select.bsb_lan_00_09_heating_circuit_1_700_operating_mode
                    value: 0 - Protection
                    kind: select
                - choose:
                  - conditions: '{{ not mode_ack.ok }}'
                    sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.bsb_heat_fault
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.bsb_calendar_enabled
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.bsb_manual_heat_status
                      data:
                        value: Stop not confirmed; retry pending
                    - action: persistent_notification.create
                      data:
                        notification_id: bsb_heat_fault
                        title: Heating stop not confirmed
                        message: Check the boiler and MQTT. Circuit-1 stop will be retried; the server cannot stop an unreachable
                          boiler.
                    - stop: Protection was not acknowledged; retain recovery journal
            - variables:
                restore_read_at: '{{ as_timestamp(now()) }}'
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/29/5978/poll
                payload: ''
                retain: false
            - action: mqtt.publish
              data:
                topic: BSB-LAN/0/9/742/poll
                payload: ''
                retain: false
